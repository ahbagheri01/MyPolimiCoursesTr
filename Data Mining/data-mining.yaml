llm:
  model: google/gemini-3.8-flash
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTERAPIKEY
  temperature: 0.1
  max_tokens: 24000
  # Forward each mapped PDF file directly to the model.
  pdf_engine: native
  reasoning:
    effort: minimal
    exclude: true

cache_dir: ../.lecture-agent-cache

workflow:
  # Zero means unlimited: send each lecture transcript and its mapped materials in full.
  transcript_chunk_chars: 0
  material_max_chars: 0
  review_transcript_max_chars: 0
  candidate_batch_size: 20

